[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rabtech-diag"
version = "0.1.0"
description = "Machine + diagnostic-event inspection CLI for the RabTech Python Software Engineering internship task."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "RabTech Intern" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
rabtech-diag = "rabtech_diag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
